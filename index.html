<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCS - Ground Control Station</title>
  <link rel="stylesheet" href="style.css">
  <!-- Подключение 3D-библиотеки Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Верхняя панель статуса систем -->
  <header id="top-bar">
    <div class="system-status">
      <span class="indicator green">●</span> LINK: <span id="val-rssi">98%</span>
      <span class="indicator green">●</span> GPS: <span id="val-sats">18 SATS</span>
    </div>
    <div class="flight-mode">
      РЕЖИМ: <span id="val-mode" class="highlight">AUTO (GCS CONTROL)</span>
    </div>
    <div class="battery-status">
      БАТАРЕЯ: <span id="val-bat">88%</span> (22.4 V)
    </div>
  </header>

  <!-- Главный контейнер НСУ -->
  <main id="gcs-workspace">
    
    <!-- Левая область: Видеопоток камеры и OSD -->
    <section id="video-feed-container">
      <canvas id="camera-canvas"></canvas>

      <!-- Прицел оператора -->
      <div id="reticle">
        <div class="cross-line h"></div>
        <div class="cross-line v"></div>
        <div id="target-box"></div>
      </div>

      <!-- Информационный оверлей OSD -->
      <div id="camera-osd">
        <div class="osd-top-left">
          CAM: <span id="cam-mode-text">DAY (OPTICAL)</span>
        </div>
        <div class="osd-top-right">
          LAT: <span id="drone-lat">55.7512</span> | LON: <span id="drone-lon">37.6184</span>
        </div>
        <div class="osd-bottom-left">
          ALT: <span id="drone-alt">120</span> m | SPEED: <span id="drone-speed">15.0</span> m/s
        </div>
        <div class="osd-bottom-right">
          RNG TO TARGET: <span id="target-dist">342</span> m
        </div>
      </div>

      <!-- Виртуальные стики для сенсора и мыши -->
      <div id="joysticks-layer">
        <div id="joy-left" class="joystick-base">
          <div class="joystick-thumb"></div>
          <span class="joy-label">ГАЗ / РЫСКАНИЕ</span>
        </div>
        <div id="joy-right" class="joystick-base">
          <div class="joystick-thumb"></div>
          <span class="joy-label">ТАНГАЖ / КРЕН</span>
        </div>
      </div>
    </section>

    <!-- Правая панель: Карта, Авиагоризонт, Команды -->
    <aside id="tactical-panel">
      <div class="panel-box">
        <h3>ТАКТИЧЕСКАЯ КАРТА</h3>
        <canvas id="map-canvas"></canvas>
      </div>

      <div class="panel-box">
        <h3>АВИАГОРИЗОНТ (PFD)</h3>
        <canvas id="pfd-canvas"></canvas>
      </div>

      <div class="panel-box controls-box">
        <h3>КОМАНДЫ НСУ</h3>
        <button id="btn-mode">РЕЖИМ КАМЕРЫ (IR / DAY)</button>
        <button id="btn-rtl" class="warning">ВОЗВРАТ ДОМОЙ (RTL)</button>
      </div>
    </aside>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
