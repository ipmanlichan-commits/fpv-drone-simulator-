<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPV Drone Simulator</title>
  <link rel="stylesheet" href="style.css">
  <!-- Подключение 3D-движка Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Экран OSD (On-Screen Display) -->
  <div id="osd">
    <div id="crosshair">+</div>
    
    <div id="telemetry">
      <div>THROTTLE: <span id="val-throttle">0</span>%</div>
      <div>ALT: <span id="val-alt">0.0</span> m</div>
      <div>SPEED: <span id="val-speed">0.0</span> m/s</div>
      <div>PITCH: <span id="val-pitch">0</span>° | ROLL: <span id="val-roll">0</span>°</div>
    </div>

    <div id="controls-help">
      <b>Управление (Mode 2):</b><br>
      W / S — Газ (Throttle)<br>
      A / D — Рыскание (Yaw)<br>
      ↑ / ↓ — Тангаж (Pitch)<br>
      ← / → — Крен (Roll)<br>
      R — Сброс (Reset)
    </div>
  </div>

  <!-- Главный скрипт физики и рендера -->
  <script src="js/app.js"></script>
</body>
</html>
