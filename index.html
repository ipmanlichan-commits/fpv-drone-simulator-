<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FPV Drone Ground Control Station</title>
  
  <!-- Подключение 3D движка Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; /* Запрет скролла страницы на смартфонах */
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050b14;
      font-family: 'Segoe UI', Roboto, monospace;
      color: #00e5ff;
    }

    /* Экран статуса */
    #status-overlay {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 16, 29, 0.85);
      border: 1px solid #00e5ff;
      padding: 6px 16px;
      border-radius: 20px;
      z-index: 999;
      font-size: 12px;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }

    /* 3D Canvas */
    #camera-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* OSD Телеметрия (Верхняя панель) */
    .osd-header {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 16, 29, 0.75);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 10px 20px;
      border-radius: 8px;
      backdrop-filter: blur(5px);
      pointer-events: none;
    }

    .telemetry-group {
      display: flex;
      gap: 20px;
    }

    .telemetry-item {
      font-size: 13px;
      font-weight: bold;
    }

    .telemetry-value {
      color: #ffffff;
    }

    /* Боковые виджеты (PFD и Карта) */
    .osd-panels {
      position: absolute;
      top: 80px;
      right: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 15px;
      pointer-events: none;
    }

    .panel-box {
      width: 180px;
      height: 120px;
      background: rgba(10, 16, 29, 0.75);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    canvas.widget-canvas {
      width: 100%;
      height: 100%;
    }
